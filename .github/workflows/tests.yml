name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q agent run.py tests
      - name: Offline smoke tests
        run: python tests/smoke_test.py
        env:
          AGENT_OFFLINE: "1"
      - name: CLI sanity
        run: python run.py --version
      - name: Cleanup dry run
        run: python -m agent.cleanup --dry-run

  tty:
    name: palette + picker (pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pty test
        run: python tests/editor_pty_test.py
